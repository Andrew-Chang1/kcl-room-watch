name: Watch KCL residences

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub may delay scheduled runs by a few minutes
  workflow_dispatch:

permissions:
  contents: write   # to save cloud-state.json between runs

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Playwright + Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check portal
        env:
          KCL_ID: ${{ secrets.KCL_ID }}
          KCL_PORTAL_PASSWORD: ${{ secrets.KCL_PORTAL_PASSWORD }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          STATE_FILE: cloud-state.json
        run: python monitor.py

      - name: Save state
        if: always()
        run: |
          git config user.name "room-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Update watch state [skip ci]"
          git pull --rebase -q && git push -q
