name: Watch KCL residences

# Each run checks the portal, waits ~9 minutes, then starts the next run itself,
# so it doesn't depend on GitHub's scheduler (which never fired for this repo).
# The schedule stays only as a backup to restart the chain if it ever breaks.
# To stop everything:  gh workflow disable watch.yml

on:
  schedule:
    - cron: "7 */3 * * *"   # backup restart every 3 hours
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email with the live room list (no real alert, state untouched)"
        type: boolean
        default: false

permissions:
  contents: write   # to save cloud-state.json between runs
  actions: write    # to start the next run

# At most one run going and one waiting; any extra copies of the chain get cancelled.
concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Playwright + Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check portal
        env:
          KCL_ID: ${{ secrets.KCL_ID }}
          KCL_PORTAL_PASSWORD: ${{ secrets.KCL_PORTAL_PASSWORD }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          STATE_FILE: cloud-state.json
          HISTORY_FILE: cloud-history.json
        run: python monitor.py ${{ inputs.test_email && '--test-alert' || '' }}

      - name: Save state
        if: always()
        continue-on-error: true
        run: |
          git config user.name "room-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-state.json cloud-history.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Update watch state [skip ci]"
          git pull --rebase -q && git push -q

      - name: Wait, then start the next check
        if: ${{ always() && !inputs.test_email }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 540
          gh workflow run watch.yml -R "$GITHUB_REPOSITORY" --ref main
